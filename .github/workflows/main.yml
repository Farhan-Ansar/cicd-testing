name: My first Cicd pipeline in Github Actions

on:
  push:
    branches: main 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Initialize Repo
        run: |
         echo "This is Farhan Molvi Repo!"
         uname -a

      - name: Check the Docker Installation
        run: |
           docker 
           docker --version
           docker images

      - name: Run Docker Container
        run:
           docker run hello-world
      
        
